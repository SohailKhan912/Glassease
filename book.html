<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book a Door</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background: #fff;
      padding: 25px 35px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      width: 400px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-weight: bold;
      color: #444;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border 0.3s;
    }

    input:focus, select:focus {
      border-color: #74b9ff;
    }

    input[type="submit"] {
      background: #0984e3;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    input[type="submit"]:hover {
      background: #74b9ff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Book Your Custom Glass Door</h2>
    <form action="submit_booking.php" method="post" enctype="multipart/form-data">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" required>

      <label for="contact">Contact</label>
      <input type="text" name="contact" id="contact" required>

      <label for="address">Address</label>
      <input type="text" name="address" id="address" required>

      <label for="door_type">Type</label>
      <select name="door_type" id="door_type">
        <option>Sliding</option>
        <option>Hinged</option>
      </select>

      <label for="size">Size</label>
      <input type="text" name="size" id="size" required>

      <label for="glass_type">Glass Type</label>
      <input type="text" name="glass_type" id="glass_type" required>

      <label for="image">Upload Reference Image</label>
      <input type="file" name="image" id="image">

      <input type="submit" value="Submit">
    </form>
  </div>

  <script>
    document.querySelector("form").addEventListener("submit", function(e) {
      let name = document.querySelector("[name='name']").value;
      let contact = document.querySelector("[name='contact']").value;

      if (name.length < 3) {
        alert("Name must be at least 3 characters.");
        e.preventDefault();
      }

      if (!/^[0-9]{10}$/.test(contact)) {
        alert("Contact must be a valid 10-digit number.");
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
